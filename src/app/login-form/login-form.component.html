<div class="login-container">
  <div class="card">
    <h2 class="title">Retail Pulse</h2>
    <p class="subtitle" *ngIf="!isVerifyStep">Sign in with your username and password.</p>
    <p class="subtitle" *ngIf="isVerifyStep">
      Enter the verification code sent to {{ maskedEmail || 'your email' }}.
    </p>
    <p class="subtitle" *ngIf="isVerifyStep && verificationCodePrefix">
      Type the 6-character code after <strong>{{ verificationCodePrefix }}</strong>.
    </p>

    <p-message *ngIf="infoMessage" severity="info" [text]="infoMessage"></p-message>
    <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage"></p-message>

    <form *ngIf="!isVerifyStep" [formGroup]="loginForm" (ngSubmit)="onStartLogin()" class="form-stack">
      <label class="field">
        <span class="label">Username</span>
        <input type="text" formControlName="username" class="input" autocomplete="username" />
      </label>

      <label class="field">
        <span class="label">Password</span>
        <input type="password" formControlName="password" class="input" autocomplete="current-password" />
      </label>

      <button type="submit" class="primary-button" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Continue' }}
      </button>
    </form>

    <form *ngIf="isVerifyStep" [formGroup]="verifyForm" (ngSubmit)="onVerifyLogin()" class="form-stack">
      <div class="verification-summary" *ngIf="displayName || deviceLabel">
        <p class="summary-text" *ngIf="displayName">Signing in as <strong>{{ displayName }}</strong></p>
        <p class="summary-text" *ngIf="deviceLabel">Device: {{ deviceLabel }}</p>
      </div>

      <label class="field">
        <span class="label">Verification Code</span>
        <div class="code-input-row">
          <span class="code-prefix">{{ verificationCodeHint }}</span>
          <input
            type="text"
            formControlName="code"
            class="input code-input code-suffix-input"
            maxlength="6"
            placeholder="______"
            inputmode="text"
            autocapitalize="characters"
            autocomplete="one-time-code"
          />
        </div>
      </label>

      <button type="submit" class="primary-button" [disabled]="loading">
        {{ loading ? 'Verifying...' : 'Verify and Continue' }}
      </button>

      <button type="button" class="secondary-button" (click)="onResendCode()" [disabled]="loading">
        Resend Code
      </button>

      <p class="hint" *ngIf="resendHint">{{ resendHint }}</p>
    </form>
  </div>
</div>
