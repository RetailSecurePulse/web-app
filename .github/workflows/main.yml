name: RetailPulse Frontend Web App CI Pipeline
env:
  NODE_VERSION: '22'          # Centralized Node.js version. Use the latest LTS version compatible with Angular 19
  SNYK_ORG: retailsecurepulse

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
    types:
      - opened
      - synchronize
      - reopened

jobs:
  web-app-unit-tests:
    name: Web App Unit Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up Node.js for Angular 19
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install Dependencies for RP Web App
      run: npm ci

    - name: Test RP Web App
      run: npm run test:ci

    - name: Upload Code Coverage Report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: code-coverage-report
        path: coverage/


    - name: Build RP Web App
      run: npm run build:prod

  web-app-sonarqube-scan:
    name: Web App SonarQube Scan
    needs: [web-app-unit-tests]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

    # Analyze Frontend (Angular Project)
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install Dependencies for RP Web App
      run: npm ci

    - name: Test RP Web App
      run: npm run test:ci

    - name: Analyze Frontend with SonarQube
      uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  web-app-snyk-scan:
    name: Web App Snyk SCA Scan
    needs: [web-app-unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js #setup-node v6.4.0 SHA
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Verify Snyk token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "${SNYK_TOKEN:-}" ]; then
            echo "::error::SNYK_TOKEN secret is not configured for this repository."
            exit 1
          fi

          http_code="$(curl -sS -o /tmp/snyk-self.json -w '%{http_code}' \
            -H "Authorization: token ${SNYK_TOKEN}" \
            -H 'Content-Type: application/vnd.api+json' \
            'https://api.snyk.io/rest/self?version=2024-06-10')"

          if [ "${http_code}" != "200" ]; then
            echo "::error::SNYK_TOKEN was rejected by Snyk API with HTTP ${http_code}. Rotate or update the GitHub secret."
            exit 1
          fi

      - name: Run Snyk test (non-blocking)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --org="${SNYK_ORG}" --severity-threshold=low || true

      - name: Monitor project in Snyk dashboard
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --all-projects --org="${SNYK_ORG}"
