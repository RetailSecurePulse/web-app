# user nginx-user;
worker_processes auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/cache/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 8080;

        # Serve static files from the Angular app
        root /usr/share/nginx/html;
        index index.html;

        location / {
            index index.html;
            try_files $uri $uri/ /index.html =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location /assets/runtime-config.json {
            default_type application/json;
            alias /usr/share/nginx/html/assets/runtime-config.json;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location /healthz {
            return 200 'OK';
            add_header Content-Type text/plain;
        }



        # Enable gzip compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # JavaScript and CSS filenames are static in this build, so they must
        # not be long-cached or browsers will keep running stale auth logic.
        location ~* \.(?:css|js)$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Cache control for fingerprint-free binary assets that change rarely.
        location ~* \.(?:ico|gif|jpe?g|png|woff2?|eot|ttf|svg|otf)$ {
            expires 1y;
            add_header Cache-Control "public";
        }
    }
}
